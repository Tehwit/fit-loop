<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#18212c">
<title>Fit Loop</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%2318212c'/%3E%3Cg fill='none' stroke='%23ff7b3a' stroke-width='2'%3E%3Ccircle cx='7' cy='16' r='3.5'/%3E%3Ccircle cx='17' cy='16' r='3.5'/%3E%3Cpath d='M7 16l3-7h5l2 7'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<header class="bar"><div class="bar-in">
  <button class="brand" data-act="home" aria-label="Fit Loop">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="6" cy="16" r="4.5"/><circle cx="18" cy="16" r="4.5"/><path d="M6 16l4-8h6l2 8M10 8l2 8h-6M9 5h3"/></svg>
    Fit Loop
  </button>
  <button class="lang" data-act="lang" id="langBtn" aria-label="Language / Langue">FR</button>
</div></header>
<main id="app"></main>

<div id="live" class="live" hidden>
  <div class="stage"><canvas id="view" width="960" height="540"></canvas></div>
  <aside class="hud">
    <div id="hud" class="hud-dyn" aria-live="polite"></div>
    <div class="tools" id="tools"></div>
  </aside>
</div>
<video id="vid" class="vid-hidden" playsinline muted></video>
<input type="file" id="fileVideo" accept="video/*" hidden>
<input type="file" id="fileImport" accept="application/json,.json" hidden>
<div id="toast" class="toast" role="status" hidden></div>
<script src="core.js?v=2"></script>
<script src="i18n.js?v=2"></script>
<script src="app.js?v=2"></script>
</body>
</html>
